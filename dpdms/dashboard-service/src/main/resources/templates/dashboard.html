<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DPDMS - Provincial Dashboard</title>
    <style>
        body { font-family: sans-serif; max-width: 1100px; margin: 30px auto; padding: 0 16px; color: #222; }
        h1 { margin-bottom: 4px; }
        .sub { color: #666; margin-top: 0; }
        .cards { display: flex; flex-wrap: wrap; gap: 12px; margin: 20px 0; }
        .card { flex: 1 1 160px; border: 1px solid #ddd; border-radius: 8px; padding: 14px; background: #fafafa; }
        .card .num { font-size: 32px; font-weight: bold; }
        .card .err { color: #b00; font-size: 13px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; }
        th { background: #f3f3f3; }
        .sev-HIGH, .sev-CRITICAL { color: #b00; font-weight: bold; }
        .sev-MEDIUM { color: #c60; }
        .sev-LOW { color: #070; }
    </style>
</head>
<body>

<h1>Rushinga Provincial Dashboard</h1>
<p class="sub">Logged in as <span id="whoami"></span>. Approved incidents across all hazards.</p>

<div id="cards" class="cards"></div>

<h2>All approved incidents</h2>
<table>
    <thead>
    <tr><th>Hazard</th><th>Ward</th><th>District</th><th>Severity</th><th>Occurred</th></tr>
    </thead>
    <tbody id="rows"><tr><td colspan="5">Loading...</td></tr></tbody>
</table>

<script src="/dashboard-service/js/js/api.js"></script>
<script>
    const HAZARDS = [
        { name: 'Flood',             service: 'flood-service' },
        { name: 'Drought',           service: 'drought-service' },
        { name: 'Fire',              service: 'fire-service' },
        { name: 'Zoonotic disease',  service: 'zoonotic-disease-service' },
        { name: 'Mining accident',   service: 'mining-accident-service' }
    ];

    function esc(v) {
        return String(v ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    }

    async function loadHazard(h) {
        try {
            const res = await fetch(GATEWAY_BASE + '/' + h.service + '/api/incidents?status=APPROVED', {
                headers: { 'Authorization': 'Bearer ' + getToken() }
            });
            if (!res.ok) {
                const why = res.status === 403 ? 'No access for your role' : 'Unavailable (' + res.status + ')';
                return { hazard: h, items: [], error: why };
            }
            const items = (await res.json()).filter(i => i.status === 'APPROVED');
            return { hazard: h, items: items };
        } catch (e) {
            return { hazard: h, items: [], error: 'Service not running' };
        }
    }

    async function loadDashboard() {
        const results = await Promise.all(HAZARDS.map(loadHazard));

        document.getElementById('cards').innerHTML = results.map(r =>
            '<div class="card"><div>' + esc(r.hazard.name) + '</div>' +
            (r.error
                ? '<div class="err">' + esc(r.error) + '</div>'
                : '<div class="num">' + r.items.length + '</div><div>approved</div>') +
            '</div>'
        ).join('');

        const all = [];
        results.forEach(r => r.items.forEach(i => all.push({ hazard: r.hazard.name, ...i })));
        all.sort((a, b) => new Date(b.occurredAt) - new Date(a.occurredAt));

        document.getElementById('rows').innerHTML = all.length === 0
            ? '<tr><td colspan="5">No approved incidents yet.</td></tr>'
            : all.map(i =>
                '<tr><td>' + esc(i.hazard) + '</td>' +
                '<td>' + esc(i.ward) + '</td>' +
                '<td>' + esc(i.district) + '</td>' +
                '<td class="sev-' + esc(i.severity) + '">' + esc(i.severity) + '</td>' +
                '<td>' + esc(new Date(i.occurredAt).toLocaleString()) + '</td></tr>'
            ).join('');
    }

    if (requireAuth(['PROVINCIAL_ADMIN', 'PROVINCIAL_SUPERVISOR'])) {
        document.getElementById('whoami').textContent = getUsername() + ' (' + getRole() + ')';
        loadDashboard();
    }
</script>
</body>
</html>
