<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DPDMS - Login</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 400px; margin: 80px auto; padding: 0 20px; }
        h1 { font-size: 1.4rem; }
        label { display: block; margin-top: 12px; font-weight: 600; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 10px 16px; width: 100%; cursor: pointer; }
        #error { color: #b00020; margin-top: 12px; }
    </style>
</head>
<body>
<h1>Rushinga DPDMS - Login</h1>
<form id="loginForm">
    <label for="username">Username</label>
    <input type="text" id="username" required>

    <label for="password">Password</label>
    <input type="password" id="password" required>

    <button type="submit">Log in</button>
</form>
<div id="error"></div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorEl = document.getElementById('error');
        errorEl.textContent = '';

        try {
            // The gateway is assumed to be on the same host, port 8080.
            const res = await fetch('http://localhost:8080/auth-service/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (!res.ok) {
                const body = await res.json().catch(() => ({}));
                errorEl.textContent = body.error || 'Login failed. Check your username and password.';
                return;
            }

            const data = await res.json();
            // Store everything the frontend needs to decide what to show
            // and to attach to future API calls. localStorage is fine
            // here since this is a class project running on localhost,
            // not a production deployment with XSS-hardening concerns.
            localStorage.setItem('dpdms_token', data.token);
            localStorage.setItem('dpdms_role', data.role);
            localStorage.setItem('dpdms_hazard', data.hazard || '');
            localStorage.setItem('dpdms_ward', data.ward || '');
            localStorage.setItem('dpdms_username', data.username);

            errorEl.style.color = 'green';
            errorEl.textContent = 'Logged in as ' + data.username + ' (' + data.role + '). You can now open your hazard service pages, e.g. http://localhost:8080/mining-accident-service/web/submit';
        } catch (err) {
            errorEl.textContent = 'Could not reach the server. Is the gateway running?';
        }
    });
</script>
</body>
</html>
