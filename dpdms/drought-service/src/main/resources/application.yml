server:
  port: 8084

spring:
  application:
    name: drought-service
  datasource:
    url: jdbc:mysql://localhost:3306/drought_db?createDatabaseIfNotExist=true
    username: ${MYSQL_APP_USER:dpdms}
    password: ${MYSQL_APP_PASSWORD:dpdms_pass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  thymeleaf:
    cache: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

dpdms:
  alerts:
    drought:
      # Brief doesn't name a drought criterion explicitly - alert once
      # either threshold is reached. Assumed values - change here or via
      # DROUGHT_DRY_DAYS_THRESHOLD / DROUGHT_CROP_FAILURE_PERCENT_THRESHOLD.
      dry-days-threshold: ${DROUGHT_DRY_DAYS_THRESHOLD:30}
      crop-failure-percent-threshold: ${DROUGHT_CROP_FAILURE_PERCENT_THRESHOLD:50.0}
