<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Drought Submissions</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; font-size: 0.9rem; }
        .status { padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
        .PENDING { background: #fff3cd; color: #856404; }
        .APPROVED { background: #d4edda; color: #155724; }
        .REJECTED { background: #f8d7da; color: #721c24; }
        .CORRECTIONS_REQUESTED { background: #d1ecf1; color: #0c5460; }
        .notes { font-style: italic; color: #555; }
    </style>
</head>
<body>
<h1>My Drought Submissions</h1>
<p><a href="/drought-service/web/submit">+ Report new drought conditions</a></p>
<table>
    <thead>
    <tr>
        <th>Rainfall deficit (mm)</th><th>Dry days</th><th>Crop failure</th><th>Assessed</th><th>Severity</th><th>Status</th><th>Review notes</th>
    </tr>
    </thead>
    <tbody id="rows"></tbody>
</table>
<p id="empty" style="display:none;">No submissions yet.</p>

<script src="/drought-service/js/api.js"></script>
<script>
    if (requireAuth(['WARD_RECORDER'])) {
        loadSubmissions();
    }

    async function loadSubmissions() {
        const res = await authFetch('/drought-service/api/incidents');
        const data = await res.json();
        const rows = document.getElementById('rows');

        if (data.length === 0) {
            document.getElementById('empty').style.display = 'block';
            return;
        }

        data.forEach(function (incident) {
            const tr = document.createElement('tr');
            tr.innerHTML =
                '<td>' + incident.rainfallDeficitMm + '</td>' +
                '<td>' + incident.consecutiveDryDays + '</td>' +
                '<td>' + incident.cropFailurePercent + '%</td>' +
                '<td>' + new Date(incident.occurredAt).toLocaleString() + '</td>' +
                '<td>' + incident.severity + '</td>' +
                '<td><span class="status ' + incident.status + '">' + incident.status.replace(/_/g, ' ') + '</span></td>' +
                '<td class="notes">' + (incident.reviewNotes || '') + '</td>';
            rows.appendChild(tr);
        });
    }
</script>
</body>
</html>
