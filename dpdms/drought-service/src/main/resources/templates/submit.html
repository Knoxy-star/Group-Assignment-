<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Report Drought Conditions</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        label { display: block; margin-top: 14px; font-weight: 600; }
        input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 24px; padding: 10px 16px; cursor: pointer; }
        #message { margin-top: 16px; padding: 10px; display: none; }
        #message.success { background: #e6f4ea; color: #1e7e34; display: block; }
        #message.error { background: #fdecea; color: #b00020; display: block; }
        .row { display: flex; gap: 12px; }
        .row > div { flex: 1; }
    </style>
</head>
<body>
<h1>Report Drought Conditions</h1>
<p>Logged in as <span id="whoami"></span> - ward: <span id="wardLabel"></span></p>

<form id="incidentForm">
    <div class="row">
        <div>
            <label for="district">District</label>
            <input type="text" id="district" required>
        </div>
        <div>
            <label for="province">Province</label>
            <input type="text" id="province" required value="Mashonaland Central">
        </div>
    </div>

    <label for="occurredAt">Date/time of assessment</label>
    <input type="datetime-local" id="occurredAt" required>

    <label for="severity">Severity</label>
    <select id="severity" required>
        <option value="LOW">Low</option>
        <option value="MODERATE">Moderate</option>
        <option value="HIGH">High</option>
        <option value="CRITICAL">Critical</option>
    </select>

    <div class="row">
        <div>
            <label for="latitude">Latitude</label>
            <input type="number" step="any" id="latitude" required placeholder="-16.7500">
        </div>
        <div>
            <label for="longitude">Longitude</label>
            <input type="number" step="any" id="longitude" required placeholder="31.0500">
        </div>
    </div>

    <hr style="margin-top:24px;">
    <h3>Drought indicators</h3>

    <div class="row">
        <div>
            <label for="rainfallDeficitMm">Rainfall deficit (mm below seasonal norm)</label>
            <input type="number" step="0.1" min="0" id="rainfallDeficitMm" required value="0">
        </div>
        <div>
            <label for="consecutiveDryDays">Consecutive dry days</label>
            <input type="number" min="0" id="consecutiveDryDays" required value="0">
        </div>
    </div>

    <label for="cropFailurePercent">Crop failure (%)</label>
    <input type="number" step="0.1" min="0" max="100" id="cropFailurePercent" required value="0">

    <div class="row">
        <div>
            <label for="peopleFacingWaterShortage">People facing water shortages</label>
            <input type="number" min="0" id="peopleFacingWaterShortage" required value="0">
        </div>
        <div>
            <label for="livestockMortalityCount">Livestock deaths</label>
            <input type="number" min="0" id="livestockMortalityCount" required value="0">
        </div>
    </div>

    <button type="submit">Submit report</button>
</form>

<div id="message"></div>
<p><a href="/drought-service/web/my-submissions">View my submissions</a></p>

<script src="/drought-service/js/api.js"></script>
<script>
    if (requireAuth(['WARD_RECORDER'])) {
        document.getElementById('whoami').textContent = getUsername();
        document.getElementById('wardLabel').textContent = localStorage.getItem('dpdms_ward');
    }

    document.getElementById('incidentForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const messageEl = document.getElementById('message');

        const payload = {
            district: document.getElementById('district').value,
            province: document.getElementById('province').value,
            occurredAt: document.getElementById('occurredAt').value,
            severity: document.getElementById('severity').value,
            latitude: parseFloat(document.getElementById('latitude').value),
            longitude: parseFloat(document.getElementById('longitude').value),
            rainfallDeficitMm: parseFloat(document.getElementById('rainfallDeficitMm').value),
            consecutiveDryDays: parseInt(document.getElementById('consecutiveDryDays').value, 10),
            cropFailurePercent: parseFloat(document.getElementById('cropFailurePercent').value),
            peopleFacingWaterShortage: parseInt(document.getElementById('peopleFacingWaterShortage').value, 10),
            livestockMortalityCount: parseInt(document.getElementById('livestockMortalityCount').value, 10)
        };

        try {
            const res = await authFetch('/drought-service/api/incidents', {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                messageEl.className = 'success';
                messageEl.textContent = 'Drought report submitted successfully. It is now pending supervisor approval.';
                document.getElementById('incidentForm').reset();
            } else {
                const body = await res.json().catch(() => ({}));
                messageEl.className = 'error';
                messageEl.textContent = body.error || 'Submission failed.';
            }
        } catch (err) {
            messageEl.className = 'error';
            messageEl.textContent = 'Could not reach the server.';
        }
    });
</script>
</body>
</html>
