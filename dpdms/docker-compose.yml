version: "3.8"


services:
  mysql:
    image: mysql:8.0
    container_name: dpdms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3306:3306"
    volumes:
      # Bind-mounted into the project folder (./mysql-data, gitignored)
      # instead of a Docker-managed named volume, so the database file
      # lives inside the repo rather than somewhere else on the host.
      - ./mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: dpdms-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP port - services connect here
      - "15672:15672" # Management UI - http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
