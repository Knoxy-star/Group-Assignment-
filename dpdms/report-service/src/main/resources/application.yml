server:
  port: 8088

spring:
  application:
    name: report-service
  datasource:
    url: jdbc:mysql://localhost:3306/report_db?createDatabaseIfNotExist=true
    username: ${MYSQL_APP_USER:dpdms}
    password: ${MYSQL_APP_PASSWORD:dpdms_pass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  thymeleaf:
    cache: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

dpdms:
  reports:
    # How long to wait for a hazard service before marking its data as
    # unavailable in the report (the report is still produced).
    connect-timeout-ms: 3000
    read-timeout-ms: 15000
