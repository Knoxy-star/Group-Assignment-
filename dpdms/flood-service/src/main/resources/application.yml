server:
  port: 8083

spring:
  application:
    name: flood-service
  datasource:
    url: jdbc:mysql://localhost:3306/flood_db?createDatabaseIfNotExist=true
    username: ${MYSQL_APP_USER:dpdms}
    password: ${MYSQL_APP_PASSWORD:dpdms_pass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  thymeleaf:
    cache: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

dpdms:
  alerts:
    flood:
      # Brief: alert on "a flood above a danger threshold". An approved
      # flood with peak water level at or above this (metres) is marked
      # as meeting the alerting criteria. Assumed value - change here or
      # via the FLOOD_DANGER_LEVEL_M environment variable.
      danger-level-m: ${FLOOD_DANGER_LEVEL_M:3.0}
