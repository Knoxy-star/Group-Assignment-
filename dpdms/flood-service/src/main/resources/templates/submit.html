<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Report a Flood</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        label { display: block; margin-top: 14px; font-weight: 600; }
        input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 24px; padding: 10px 16px; cursor: pointer; }
        #message { margin-top: 16px; padding: 10px; display: none; }
        #message.success { background: #e6f4ea; color: #1e7e34; display: block; }
        #message.error { background: #fdecea; color: #b00020; display: block; }
        .row { display: flex; gap: 12px; }
        .row > div { flex: 1; }
    </style>
</head>
<body>
<h1>Report a Flood</h1>
<p>Logged in as <span id="whoami"></span> - ward: <span id="wardLabel"></span></p>

<form id="incidentForm">
    <div class="row">
        <div>
            <label for="district">District</label>
            <input type="text" id="district" required value="Rushinga">
        </div>
        <div>
            <label for="province">Province</label>
            <input type="text" id="province" required value="Mashonaland Central">
        </div>
    </div>

    <label for="occurredAt">Date/time of occurrence</label>
    <input type="datetime-local" id="occurredAt" required>

    <label for="severity">Severity</label>
    <select id="severity" required>
        <option value="LOW">Low</option>
        <option value="MODERATE">Moderate</option>
        <option value="HIGH">High</option>
        <option value="CRITICAL">Critical</option>
    </select>

    <div class="row">
        <div>
            <label for="latitude">Latitude</label>
            <input type="number" step="any" id="latitude" required placeholder="-16.7500">
        </div>
        <div>
            <label for="longitude">Longitude</label>
            <input type="number" step="any" id="longitude" required placeholder="31.0500">
        </div>
    </div>

    <hr style="margin-top:24px;">
    <h3>Flood details</h3>

    <label for="catchment">River basin / catchment</label>
    <select id="catchment" required>
        <option value="MAZOWE" selected>Mazowe</option>
        <option value="GWAYI">Gwayi</option>
        <option value="MANYAME">Manyame</option>
        <option value="MZINGWANE">Mzingwane</option>
        <option value="RUNDE">Runde</option>
        <option value="SANYATI">Sanyati</option>
        <option value="SAVE">Save</option>
    </select>

    <div class="row">
        <div>
            <label for="peakWaterLevelMetres">Peak water level (m)</label>
            <input type="number" step="0.01" min="0" id="peakWaterLevelMetres" required>
        </div>
        <div>
            <label for="areaFloodedHectares">Area flooded (hectares)</label>
            <input type="number" step="0.01" min="0" id="areaFloodedHectares" required>
        </div>
    </div>

    <div class="row">
        <div>
            <label for="householdsDisplaced">Households displaced</label>
            <input type="number" min="0" id="householdsDisplaced" required value="0">
        </div>
        <div>
            <label for="inundationDurationDays">Duration of inundation (days)</label>
            <input type="number" min="0" id="inundationDurationDays" required value="0">
        </div>
    </div>

    <button type="submit">Submit incident</button>
</form>

<div id="message"></div>
<p><a href="/flood-service/web/my-submissions">View my submissions</a></p>

<script src="/flood-service/js/api.js"></script>
<script>
    if (requireAuth(['WARD_RECORDER'])) {
        document.getElementById('whoami').textContent = getUsername();
        document.getElementById('wardLabel').textContent = localStorage.getItem('dpdms_ward');
    }

    document.getElementById('incidentForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const messageEl = document.getElementById('message');

        const payload = {
            district: document.getElementById('district').value,
            province: document.getElementById('province').value,
            occurredAt: document.getElementById('occurredAt').value,
            severity: document.getElementById('severity').value,
            latitude: parseFloat(document.getElementById('latitude').value),
            longitude: parseFloat(document.getElementById('longitude').value),
            peakWaterLevelMetres: parseFloat(document.getElementById('peakWaterLevelMetres').value),
            catchment: document.getElementById('catchment').value,
            householdsDisplaced: parseInt(document.getElementById('householdsDisplaced').value, 10),
            areaFloodedHectares: parseFloat(document.getElementById('areaFloodedHectares').value),
            inundationDurationDays: parseInt(document.getElementById('inundationDurationDays').value, 10)
        };

        try {
            const res = await authFetch('/flood-service/api/incidents', {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                messageEl.className = 'success';
                messageEl.textContent = 'Incident submitted successfully. It is now pending supervisor approval.';
                document.getElementById('incidentForm').reset();
            } else {
                const body = await res.json().catch(() => ({}));
                messageEl.className = 'error';
                messageEl.textContent = body.error || 'Submission failed.';
            }
        } catch (err) {
            messageEl.className = 'error';
            messageEl.textContent = 'Could not reach the server.';
        }
    });
</script>
</body>
</html>
