<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Zoonotic Disease - Approval Queue</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; font-size: 0.9rem; vertical-align: top; }
        button { padding: 5px 10px; margin-right: 4px; cursor: pointer; font-size: 0.8rem; }
        .approve { background: #d4edda; border: 1px solid #1e7e34; }
        .reject { background: #f8d7da; border: 1px solid #b00020; }
        .corrections { background: #d1ecf1; border: 1px solid #0c5460; }
    </style>
</head>
<body>
<h1>Zoonotic Disease - Pending Approval Queue</h1>
<table>
    <thead>
    <tr>
        <th>Ward</th><th>Disease</th><th>Species</th><th>Animal cases</th><th>Human cases</th><th>Classification</th><th>Occurred</th><th>Actions</th>
    </tr>
    </thead>
    <tbody id="rows"></tbody>
</table>
<p id="empty" style="display:none;">Nothing pending right now.</p>

<script src="/zoonotic-disease-service/js/api.js"></script>
<script>
    if (requireAuth(['PROVINCIAL_SUPERVISOR'])) {
        loadQueue();
    }

    async function loadQueue() {
        const res = await authFetch('/zoonotic-disease-service/api/incidents?status=PENDING');
        const data = await res.json();
        const rows = document.getElementById('rows');
        rows.innerHTML = '';

        if (data.length === 0) {
            document.getElementById('empty').style.display = 'block';
            return;
        }
        document.getElementById('empty').style.display = 'none';

        data.forEach(function (incident) {
            const tr = document.createElement('tr');
            tr.innerHTML =
                '<td>' + incident.ward + '</td>' +
                '<td>' + incident.diseaseName + '</td>' +
                '<td>' + incident.animalSpecies + '</td>' +
                '<td>' + incident.confirmedAnimalCases + '</td>' +
                '<td>' + incident.humanCasesCount + '</td>' +
                '<td>' + incident.outbreakClassification + '</td>' +
                '<td>' + new Date(incident.occurredAt).toLocaleString() + '</td>' +
                '<td>' +
                '<button class="approve" onclick="approve(' + incident.id + ')">Approve</button>' +
                '<button class="reject" onclick="reject(' + incident.id + ')">Reject</button>' +
                '<button class="corrections" onclick="requestCorrections(' + incident.id + ')">Request corrections</button>' +
                '</td>';
            rows.appendChild(tr);
        });
    }

    async function approve(id) {
        await authFetch('/zoonotic-disease-service/api/incidents/' + id + '/approve', { method: 'POST' });
        loadQueue();
    }

    async function reject(id) {
        const notes = prompt('Reason for rejection:');
        if (!notes) return;
        await authFetch('/zoonotic-disease-service/api/incidents/' + id + '/reject', {
            method: 'POST',
            body: JSON.stringify({ notes: notes })
        });
        loadQueue();
    }

    async function requestCorrections(id) {
        const notes = prompt('What needs to be corrected?');
        if (!notes) return;
        await authFetch('/zoonotic-disease-service/api/incidents/' + id + '/request-corrections', {
            method: 'POST',
            body: JSON.stringify({ notes: notes })
        });
        loadQueue();
    }
</script>
</body>
</html>
