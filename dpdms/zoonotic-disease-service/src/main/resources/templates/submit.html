<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Report a Zoonotic Disease Event</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        label { display: block; margin-top: 14px; font-weight: 600; }
        input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 24px; padding: 10px 16px; cursor: pointer; }
        #message { margin-top: 16px; padding: 10px; display: none; }
        #message.success { background: #e6f4ea; color: #1e7e34; display: block; }
        #message.error { background: #fdecea; color: #b00020; display: block; }
        .row { display: flex; gap: 12px; }
        .row > div { flex: 1; }
    </style>
</head>
<body>
<h1>Report a Zoonotic Disease Event</h1>
<p>Logged in as <span id="whoami"></span> - ward: <span id="wardLabel"></span></p>

<form id="incidentForm">
    <div class="row">
        <div>
            <label for="district">District</label>
            <input type="text" id="district" required>
        </div>
        <div>
            <label for="province">Province</label>
            <input type="text" id="province" required value="Mashonaland Central">
        </div>
    </div>

    <label for="occurredAt">Date/time of occurrence</label>
    <input type="datetime-local" id="occurredAt" required>

    <label for="severity">Severity</label>
    <select id="severity" required>
        <option value="LOW">Low</option>
        <option value="MODERATE">Moderate</option>
        <option value="HIGH">High</option>
        <option value="CRITICAL">Critical</option>
    </select>

    <div class="row">
        <div>
            <label for="latitude">Latitude</label>
            <input type="number" step="any" id="latitude" required placeholder="-16.7500">
        </div>
        <div>
            <label for="longitude">Longitude</label>
            <input type="number" step="any" id="longitude" required placeholder="31.0500">
        </div>
    </div>

    <hr style="margin-top:24px;">
    <h3>Zoonotic disease details</h3>

    <label for="diseaseName">Pathogen / disease name</label>
    <input type="text" id="diseaseName" required placeholder="e.g. Anthrax, Rabies">

    <label for="animalSpecies">Animal species affected</label>
    <select id="animalSpecies" required>
        <option value="CATTLE">Cattle</option>
        <option value="GOATS">Goats</option>
        <option value="SHEEP">Sheep</option>
        <option value="PIGS">Pigs</option>
        <option value="POULTRY">Poultry</option>
        <option value="DOGS">Dogs</option>
        <option value="WILDLIFE">Wildlife</option>
        <option value="OTHER">Other</option>
    </select>

    <div class="row">
        <div>
            <label for="confirmedAnimalCases">Confirmed animal cases</label>
            <input type="number" min="0" id="confirmedAnimalCases" required value="0">
        </div>
        <div>
            <label for="humanCasesCount">Confirmed human cases</label>
            <input type="number" min="0" id="humanCasesCount" required value="0">
        </div>
    </div>

    <label for="outbreakClassification">Classification</label>
    <select id="outbreakClassification" required>
        <option value="CLUSTER">Cluster</option>
        <option value="OUTBREAK">Outbreak</option>
    </select>

    <button type="submit">Submit incident</button>
</form>

<div id="message"></div>
<p><a href="/zoonotic-disease-service/web/my-submissions">View my submissions</a></p>

<script src="/zoonotic-disease-service/js/api.js"></script>
<script>
    if (requireAuth(['WARD_RECORDER'])) {
        document.getElementById('whoami').textContent = getUsername();
        document.getElementById('wardLabel').textContent = localStorage.getItem('dpdms_ward');
    }

    document.getElementById('incidentForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const messageEl = document.getElementById('message');

        const payload = {
            district: document.getElementById('district').value,
            province: document.getElementById('province').value,
            occurredAt: document.getElementById('occurredAt').value,
            severity: document.getElementById('severity').value,
            latitude: parseFloat(document.getElementById('latitude').value),
            longitude: parseFloat(document.getElementById('longitude').value),
            diseaseName: document.getElementById('diseaseName').value,
            animalSpecies: document.getElementById('animalSpecies').value,
            confirmedAnimalCases: parseInt(document.getElementById('confirmedAnimalCases').value, 10),
            outbreakClassification: document.getElementById('outbreakClassification').value,
            humanCasesCount: parseInt(document.getElementById('humanCasesCount').value, 10)
        };

        try {
            const res = await authFetch('/zoonotic-disease-service/api/incidents', {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                messageEl.className = 'success';
                messageEl.textContent = 'Incident submitted successfully. It is now pending supervisor approval.';
                document.getElementById('incidentForm').reset();
            } else {
                const body = await res.json().catch(() => ({}));
                messageEl.className = 'error';
                messageEl.textContent = body.error || 'Submission failed.';
            }
        } catch (err) {
            messageEl.className = 'error';
            messageEl.textContent = 'Could not reach the server.';
        }
    });
</script>
</body>
</html>
