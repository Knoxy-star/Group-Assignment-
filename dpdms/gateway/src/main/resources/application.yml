server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      discovery:
        locator:
          # lets us also hit services directly as /SERVICE-NAME/** without
          # writing an explicit route - handy while a service is still new
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth-service/**
          filters:
            - StripPrefix=1

        - id: flood-service
          uri: lb://flood-service
          predicates:
            - Path=/flood-service/**
          filters:
            - StripPrefix=1

        - id: drought-service
          uri: lb://drought-service
          predicates:
            - Path=/drought-service/**
          filters:
            - StripPrefix=1

        - id: fire-service
          uri: lb://fire-service
          predicates:
            - Path=/fire-service/**
          filters:
            - StripPrefix=1

        - id: zoonotic-disease-service
          uri: lb://zoonotic-disease-service
          predicates:
            - Path=/zoonotic-disease-service/**
          filters:
            - StripPrefix=1

        - id: mining-accident-service
          uri: lb://mining-accident-service
          predicates:
            - Path=/mining-accident-service/**
          filters:
            - StripPrefix=1

        - id: report-service
          uri: lb://report-service
          predicates:
            - Path=/report-service/**
          filters:
            - StripPrefix=1

        - id: alert-service
          uri: lb://alert-service
          predicates:
            - Path=/alert-service/**
          filters:
            - StripPrefix=1

        - id: dashboard-service
          uri: lb://dashboard-service
          predicates:
            - Path=/dashboard-service/**
          filters:
            - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
