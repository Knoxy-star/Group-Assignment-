server:
  port: 8087

spring:
  application:
    name: alert-service
  datasource:
    url: jdbc:mysql://localhost:3306/alert_db?createDatabaseIfNotExist=true
    username: ${MYSQL_APP_USER:dpdms}
    password: ${MYSQL_APP_PASSWORD:dpdms_pass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  thymeleaf:
    cache: false
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # A message that still fails after 3 tries is dropped instead of
        # being redelivered forever (a "poison message" loop).
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
  # SMTP login for email alerts. Values come from environment variables
  # set in the IntelliJ run configuration - never type them in here.
  # Gmail: MAIL_USERNAME = the Gmail address, MAIL_PASSWORD = a 16-char
  # app password (Google Account > Security > App passwords).
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # Don't report alert-service as DOWN just because email isn't set up.
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

dpdms:
  alerts:
    # Hazard services publish to this exchange with routing key
    # "incident.approved.<hazard>", e.g. incident.approved.flood
    exchange: dpdms.incidents
    queue: alert-service.incident-approved
    routing-key: incident.approved.#
    # Brief: alerts go out when an incident "meets defined alerting
    # criteria". Each hazard service checks its own indicators and sends
    # alertCriteriaMet=true/false in the event. As a safety net, anything
    # at or above this severity ALWAYS alerts. Incidents that don't
    # qualify are still recorded, with status SUPPRESSED.
    always-alert-severity: ${ALERT_ALWAYS_SEVERITY:CRITICAL}

  email:
    # false = no emails sent. With email AND WhatsApp disabled, alerts are
    # written to the application log instead (safe default for dev).
    enabled: ${EMAIL_ENABLED:false}
    from: ${MAIL_USERNAME:}
    # Comma-separated email addresses
    recipients: ${EMAIL_RECIPIENTS:}

  whatsapp:
    # false = no WhatsApp messages sent.
    # Set the WHATSAPP_* values as environment variables in the IntelliJ
    # run configuration - never type the token into this file.
    enabled: ${WHATSAPP_ENABLED:false}
    api-version: ${WHATSAPP_API_VERSION:v22.0}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    # Comma-separated, international format, no + or spaces: 2637XXXXXXXX
    recipients: ${WHATSAPP_RECIPIENTS:}
    # template = send an approved template (hello_world works out of the box)
    # text     = send the full alert text (only delivered inside Meta's
    #            24-hour window after the recipient has messaged your number)
    message-type: ${WHATSAPP_MESSAGE_TYPE:template}
    template-name: ${WHATSAPP_TEMPLATE_NAME:hello_world}
    template-language: ${WHATSAPP_TEMPLATE_LANGUAGE:en_US}
