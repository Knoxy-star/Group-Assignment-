<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DPDMS Alerts</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; vertical-align: top; font-size: 14px; }
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; }
        .SENT { background: #e6f4ea; color: #1e7e34; }
        .LOGGED_ONLY { background: #e8f0fe; color: #1a56db; }
        .FAILED { background: #fdecea; color: #b00020; }
        .SUPPRESSED { background: #eee; color: #555; }
        .sev-CRITICAL, .sev-HIGH { color: #b00020; font-weight: 600; }
        #empty, #error { margin-top: 20px; }
        #error { color: #b00020; }
        .detail { color: #666; font-size: 12px; }
        .log { margin: 6px 0 0; padding: 0; list-style: none; font-size: 12px; color: #444; }
        .log li { margin-top: 3px; white-space: nowrap; }
        .log .badge { font-size: 10px; padding: 1px 5px; }
    </style>
</head>
<body>
<h1>Alerts</h1>
<p>Logged in as <span id="whoami"></span> (<span id="role"></span>)</p>

<table id="alertsTable" style="display:none;">
    <thead>
    <tr>
        <th>Received</th><th>Hazard</th><th>Severity</th><th>Location</th>
        <th>Message</th><th>Channel</th><th>Delivery</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>
<p id="empty" style="display:none;">No alerts yet.</p>
<p id="error" style="display:none;"></p>

<script src="/alert-service/js/api.js"></script>
<script>
    function esc(v) {
        return String(v == null ? '' : v)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Delivery log: one line per channel per recipient, with time and status.
    function deliveryLog(deliveries) {
        if (!deliveries || deliveries.length === 0) {
            return '';
        }
        return '<ul class="log">' + deliveries.map(function (d) {
            const when = d.attemptedAt ? new Date(d.attemptedAt).toLocaleTimeString() : '';
            return '<li title="' + esc(d.detail) + '">' + esc(d.channel) + ' &rarr; ' + esc(d.recipient) +
                ' <span class="badge ' + esc(d.status) + '">' + esc(d.status.replace('_', ' ')) + '</span> ' +
                esc(when) + '</li>';
        }).join('') + '</ul>';
    }

    async function loadAlerts() {
        const errorEl = document.getElementById('error');
        const res = await authFetch('/alert-service/api/alerts');
        if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            errorEl.textContent = body.error || ('Could not load alerts (HTTP ' + res.status + ')');
            errorEl.style.display = 'block';
            return;
        }
        const data = await res.json();
        if (data.length === 0) {
            document.getElementById('empty').style.display = 'block';
            return;
        }
        const tbody = document.querySelector('#alertsTable tbody');
        data.forEach(function (a) {
            const tr = document.createElement('tr');
            const location = [a.ward, a.district].filter(Boolean).join(', ');
            tr.innerHTML =
                '<td>' + esc(new Date(a.receivedAt).toLocaleString()) + '</td>' +
                '<td>' + esc(a.hazard.replace('_', ' ')) + '</td>' +
                '<td class="sev-' + esc(a.severity) + '">' + esc(a.severity) + '</td>' +
                '<td>' + esc(location) + '</td>' +
                '<td>' + esc(a.message) + '</td>' +
                '<td>' + esc(a.channel) + '</td>' +
                '<td><span class="badge ' + esc(a.deliveryStatus) + '">' + esc(a.deliveryStatus.replace('_', ' ')) + '</span>' +
                (a.deliveryDetail ? '<div class="detail">' + esc(a.deliveryDetail) + '</div>' : '') +
                deliveryLog(a.deliveries) + '</td>';
            tbody.appendChild(tr);
        });
        document.getElementById('alertsTable').style.display = 'table';
    }

    if (requireAuth(['PROVINCIAL_SUPERVISOR', 'NATIONAL_VIEWER', 'PROVINCIAL_ADMIN'])) {
        document.getElementById('whoami').textContent = getUsername();
        document.getElementById('role').textContent = getRole();
        loadAlerts();
    }
</script>
</body>
</html>
